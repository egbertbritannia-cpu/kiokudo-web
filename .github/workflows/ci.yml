name: Kiokudo Web CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build

  cross-repo-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Kiokudo Web
        uses: actions/checkout@v4
      - name: Checkout Kiokudo Core
        uses: actions/checkout@v4
        with:
          repository: egbertbritannia-cpu/kiokudo-core
          # Update deliberately only after Core compatibility CI has passed.
          ref: 67682872d78f37559e4c9e9d109c5c8320d418c1
          path: kiokudo-core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Web dependencies
        run: npm install --no-audit --no-fund
      - name: Install Core dependencies
        working-directory: kiokudo-core
        run: npm install --no-audit --no-fund
      - name: Seed isolated SQLite rehearsal from tracked Git JSON
        working-directory: kiokudo-core
        run: |
          npm run staging:local -- seed ./staging-smoke.db
          npm run staging:local -- audit ./staging-smoke.db
      - name: Add CI-only Grammar and IELTS fixture records
        run: python3 scripts/seed-phase4b-smoke.py kiokudo-core/staging-smoke.db
      - name: Build Core
        working-directory: kiokudo-core
        run: npm run build
      - name: Start local Core
        run: |
          cd kiokudo-core
          nohup env KIOKUDO_SERVICE_TOKEN='ci-only-service-token-never-production' \
            KIOKUDO_DATABASE_SCOPE=staging \
            KIOKUDO_EXPECTED_STAGING_MARKER=kiokudo-local-json-fixture-not-production-v1 \
            KIOKUDO_DATABASE_URL=file:./staging-smoke.db \
            npm run start > ../core-staging.log 2>&1 &
      - name: Start local Web
        run: |
          nohup env KIOKUDO_STAGING_READ_ENABLED=true \
            KIOKUDO_CORE_URL=http://127.0.0.1:4000 \
            KIOKUDO_CORE_SERVICE_TOKEN='ci-only-service-token-never-production' \
            npm run dev -- --hostname 127.0.0.1 > web-staging.log 2>&1 &
      - name: Smoke test real Web BFF → Core HTTP path
        run: node scripts/smoke-cross-repo.mjs
      - name: Log diagnostics on failure
        if: failure()
        run: |
          tail -n 100 core-staging.log || true
          tail -n 100 web-staging.log || true
